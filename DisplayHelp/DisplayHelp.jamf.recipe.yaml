Description: Downloads the latest DisplayHelp installer package and uploads it, with its icon, to Jamf Pro.
Identifier: com.github.hov172.jamf.DisplayHelp
MinimumVersion: "2.3"
ParentRecipe: com.github.hov172.download.DisplayHelp

Input:
  NAME: DisplayHelp
  CATEGORY: Utilities

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_path: "%pathname%"
      pkg_category: "%CATEGORY%"
      pkg_notes: DisplayHelp %version%. Signed and notarized by Ayala Solutions (N859JA9UCJ).

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfIconUploader
    Arguments:
      icon_file: "%RECIPE_DIR%/%NAME%.png"
