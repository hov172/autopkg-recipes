Description: Downloads the latest BonjourView release, builds a flat installer package from the app, and optionally signs it. Input SIGNING_IDENTITY (default empty = unsigned) is the name of a Developer ID Installer identity in your keychain; set it in an override to sign.
Identifier: com.github.hov172.pkg.BonjourView
MinimumVersion: "2.3"
ParentRecipe: com.github.hov172.download.BonjourView

Input:
  NAME: BonjourView
  SIGNING_IDENTITY: ""

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%found_filename%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"

  - Processor: BonjourViewPkgSigner
    Arguments:
      pkg_path: "%pkg_path%"
      signing_identity: "%SIGNING_IDENTITY%"
