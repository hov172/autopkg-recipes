Description: Downloads the latest Stash Video installer package and imports it into Munki.
Identifier: com.github.hov172.munki.StashVideo
MinimumVersion: "2.3"
ParentRecipe: com.github.hov172.download.StashVideo

Input:
  NAME: StashVideo
  MUNKI_REPO_SUBDIR: apps/%NAME%
  MUNKI_CATALOG: testing
  pkginfo:
    catalogs:
      - "%MUNKI_CATALOG%"
    category: Utilities
    description: Stash Video downloads and trims video from the web. Bundles yt-dlp and ffmpeg; no extra dependencies.
    developer: Ayala Solutions
    display_name: Stash Video
    name: "%NAME%"
    minimum_os_version: "26.0"
    unattended_install: true
    unattended_uninstall: true

Process:
  - Processor: MunkiImporter
    Arguments:
      pkg_path: "%pathname%"
      repo_subdirectory: "%MUNKI_REPO_SUBDIR%"
      extract_icon: true
